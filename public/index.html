<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYX PANEL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background:#000; min-height:100vh; display:flex;
    justify-content:center; align-items:flex-start;
    padding:16px; color:#e8e8e8; position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; top:0; left:0; width:100%; height:100%;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 49px, rgba(184,155,62,0.15) 50px, transparent 51px),
      repeating-linear-gradient(90deg, transparent 0, transparent 49px, rgba(184,155,62,0.15) 50px, transparent 51px);
    background-size:50px 50px; z-index:-2;
    animation:gridMove 8s linear infinite;
  }
  @keyframes gridMove { 0%{transform:translate(0,0);} 100%{transform:translate(50px,50px);} }
  .scan-line {
    position:fixed; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg,transparent,#b89b3e,transparent);
    box-shadow:0 0 20px #b89b3e; z-index:1;
    animation:scan 4s linear infinite;
  }
  @keyframes scan { 0%{top:0;opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{top:100%;opacity:0;} }
  .app {
    width:100%; max-width:440px; background:rgba(10,10,10,0.85);
    backdrop-filter:blur(12px); border-radius:20px; padding:18px;
    border:1px solid rgba(184,155,62,0.3);
    box-shadow:0 10px 60px rgba(0,0,0,0.9), 0 0 40px rgba(184,155,62,0.15);
    position:relative; z-index:2;
  }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid rgba(184,155,62,0.2); gap:8px; }
  .profile-wrap { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .profile-pic {
    width:42px; height:42px; border-radius:12px;
    background:linear-gradient(135deg,#b89b3e,#7a6520);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; border:2px solid rgba(184,155,62,0.5);
    box-shadow:0 0 15px rgba(184,155,62,0.4);
  }
  .profile-pic img { width:100%; height:100%; object-fit:cover; }
  .profile-info { display:flex; flex-direction:column; gap:4px; }
  .profile-name { font-size:13px; font-weight:800; color:#fff; letter-spacing:1px; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profile-role { display:flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-size:8px; font-weight:800; letter-spacing:1px; border:1px solid; align-self:flex-start; }
  .profile-role .role-dot { width:5px; height:5px; border-radius:50%; }
  .role-MEMBER { color:#9c9484; border-color:#3a3a3a; background:#1a1a1a; }
  .role-MEMBER .role-dot { background:#9c9484; }
  .role-PREMIUM { color:#3498db; border-color:#1f4a6b; background:#0e1a24; }
  .role-PREMIUM .role-dot { background:#3498db; }
  .role-VVIP { color:#f39c12; border-color:#7a5a1f; background:#241a0e; }
  .role-VVIP .role-dot { background:#f39c12; }
  .role-OWNER { color:#e74c3c; border-color:#7a1f1f; background:#240e0e; }
  .role-OWNER .role-dot { background:#e74c3c; }
  .role-DEVELOPER { color:#9b59b6; border-color:#4a1f6b; background:#1a0e24; }
  .role-DEVELOPER .role-dot { background:#9b59b6; }
  .header-actions { display:flex; gap:6px; }
  .icon-btn { width:34px; height:34px; border-radius:10px; background:rgba(26,26,26,0.8); border:1px solid #2a2a2a; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:active { transform:scale(0.92); }
  .server-status { display:flex; align-items:center; gap:8px; background:rgba(14,31,14,0.5); border:1px solid rgba(46,204,113,0.3); border-radius:10px; padding:8px 12px; margin-bottom:14px; font-size:9px; color:#2ecc71; font-weight:700; letter-spacing:1px; }
  .server-status .dot-live { width:6px; height:6px; border-radius:50%; background:#2ecc71; box-shadow:0 0 8px #2ecc71; animation:pulseDot 1.5s infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .server-status .latency { margin-left:auto; color:#666; font-size:8px; }
  .login-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:5000; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .login-screen.hidden { display:none; }
  .login-box { width:100%; max-width:380px; background:rgba(15,15,15,0.95); border-radius:20px; padding:28px 22px; border:1px solid rgba(184,155,62,0.4); box-shadow:0 20px 80px rgba(0,0,0,0.9), 0 0 60px rgba(184,155,62,0.2); margin:auto; }
  .login-box .logo-big { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#b89b3e,#7a6520); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 0 40px rgba(184,155,62,0.6); }
  .login-box h2 { text-align:center; font-size:18px; font-weight:800; color:#fff; letter-spacing:3px; margin-bottom:6px; }
  .login-box .sub { text-align:center; font-size:10px; color:#666; letter-spacing:1px; margin-bottom:24px; }
  .login-tabs { display:flex; gap:8px; margin-bottom:20px; }
  .login-tab { flex:1; padding:10px; text-align:center; background:#0a0a0a; border-radius:10px; font-size:10px; font-weight:800; letter-spacing:1px; color:#666; cursor:pointer; border:1px solid #2a2a2a; }
  .login-tab.active { background:linear-gradient(135deg,#b89b3e,#8a6f1f); color:#fff; border-color:#b89b3e; }
  .login-field { width:100%; background:#0a0a0a; border:1px solid #2a2a2a; border-radius:12px; padding:14px 16px; color:#fff; font-size:13px; outline:none; margin-bottom:12px; letter-spacing:1px; }
  .login-btn { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#b89b3e,#8a6f1f); color:#fff; font-weight:800; font-size:13px; letter-spacing:2px; cursor:pointer; margin-top:6px; }
  .login-error { color:#e74c3c; font-size:10px; text-align:center; margin-top:12px; min-height:14px; }
  .page { display:none; }
  .page.active { display:block; animation:fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .title { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; letter-spacing:1px; color:#ddd; margin-bottom:12px; }
  .title .icon-box { width:30px; height:30px; background:rgba(26,26,26,0.8); border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid #2a2a2a; }
  .input-wrap { background:rgba(26,26,26,0.8); border-radius:14px; padding:13px 15px; display:flex; align-items:center; gap:10px; margin-bottom:18px; border:1px solid #2a2a2a; }
  .input-wrap input { border:none; background:transparent; outline:none; font-size:14px; color:#eee; width:100%; letter-spacing:1px; }
  .input-wrap input::placeholder { color:#555; }
  .intensity-bar { display:flex; gap:6px; margin-bottom:14px; align-items:center; }
  .intensity-bar .label { font-size:10px; color:#888; font-weight:700; margin-right:4px; }
  .intensity-opt { flex:1; padding:8px 4px; text-align:center; border-radius:8px; background:rgba(26,26,26,0.8); border:1px solid #2a2a2a; font-size:9px; font-weight:800; color:#666; cursor:pointer; }
  .intensity-opt.active { background:#2a1414; border-color:#e74c3c; color:#e74c3c; }
  .btn-send { width:100%; background:linear-gradient(135deg,#b89b3e,#8a6f1f); color:#fff; border:none; padding:15px; border-radius:14px; font-size:14px; font-weight:800; letter-spacing:1.5px; cursor:pointer; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 8px 25px rgba(184,155,62,0.5); }
  .btn-send:active { transform:scale(0.97); }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .feature-card { background:rgba(26,26,26,0.8); border-radius:16px; padding:16px; border:1px solid #2a2a2a; cursor:pointer; position:relative; }
  .feature-card:active { transform:scale(0.97); background:#222; }
  .feature-card .f-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; background:#2a1414; border:1px solid #4a2020; }
  .feature-card h4 { font-size:12px; font-weight:800; color:#fff; letter-spacing:0.5px; }
  .feature-card p { font-size:9px; color:#777; margin-top:4px; }
  .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:999; cursor:pointer; backdrop-filter:blur(6px); }
  .overlay.show { display:flex; }
  .check-big { width:120px; height:120px; border-radius:50%; background:#2ecc71; display:flex; align-items:center; justify-content:center; box-shadow:0 0 80px rgba(46,204,113,1); animation:pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
  @keyframes pop { 0%{transform:scale(0);} 100%{transform:scale(1);} }
  .overlay p { color:#fff; font-size:18px; font-weight:800; letter-spacing:2px; margin-top:20px; text-align:center; padding:0 20px; }
  .loading-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:1000; backdrop-filter:blur(6px); }
  .loading-overlay.show { display:flex; }
  .spinner { width:70px; height:70px; border-radius:50%; border:4px solid rgba(184,155,62,0.2); border-top-color:#b89b3e; animation:spin 0.8s linear infinite; box-shadow:0 0 30px rgba(184,155,62,0.5); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-overlay p { color:#b89b3e; font-size:12px; font-weight:800; letter-spacing:2px; margin-top:22px; text-align:center; padding:0 20px; }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#b89b3e; color:#fff; padding:10px 20px; border-radius:10px; font-size:11px; font-weight:700; letter-spacing:1px; z-index:2000; opacity:0; transition:0.3s; max-width:90%; text-align:center; box-shadow:0 0 30px rgba(184,155,62,0.6); }
  .toast.show { opacity:1; bottom:40px; }
</style>
</head>
<body>

<div class="scan-line"></div>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo-big">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h2>LYX PANEL</h2>
    <div class="sub">SECURE ACCESS SYSTEM</div>
    <div class="login-tabs">
      <div class="login-tab active" data-tab="login">LOGIN</div>
      <div class="login-tab" data-tab="register">CREAT ACCOUNT</div>
    </div>
    <input type="text" class="login-field" id="loginUser" placeholder="USERNAME" autocomplete="off">
    <input type="password" class="login-field" id="loginPass" placeholder="PASSWORD" autocomplete="off">
    <button class="login-btn" id="loginBtn">MASUK</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="profile-wrap" id="profileWrap">
      <div class="profile-pic" id="headerProfilePic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="headerProfileName">USER</div>
        <div class="profile-role role-MEMBER" id="headerProfileRole">
          <div class="role-dot"></div>
          <span id="headerRoleText">MEMBER</span>
        </div>
      </div>
    </div>
  </div>

  <div class="server-status">
    <div class="dot-live"></div>
    <span id="serverStatusText">BACKEND CONNECTED</span>
    <span class="latency" id="latencyText">-- ms</span>
  </div>

  <div class="page active" id="pageBug">
    <div class="title">
      <div class="icon-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b89b3e" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="3"/>
        </svg>
      </div>
      NOMOR TARGET
    </div>
    <div class="input-wrap">
      <input type="tel" id="target" placeholder="62xxxxxxxxxx" maxlength="15">
    </div>
    <div class="title">
      <div class="icon-box">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      LEVEL SERANGAN
    </div>
    <div class="intensity-bar">
      <span class="label">:</span>
      <div class="intensity-opt active" data-level="normal">NORMAL</div>
      <div class="intensity-opt" data-level="hard">HARD</div>
      <div class="intensity-opt" data-level="extreme">EXTREME</div>
    </div>
    <button class="btn-send" id="btnSend">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      KIRIM BUG
    </button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingText">MEMPROSES...</p>
</div>

<div class="overlay" id="overlay">
  <div class="check-big">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <p id="overlayText">BERHASIL</p>
</div>

<div class="toast" id="toast">Berhasil</div>

<script>
  const BACKEND_URL = window.location.origin;
  const USERS_KEY = 'lyx_users';
  const SESSION_KEY = 'lyx_session';

  function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) { return {}; } }
  function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } }

  const loginScreen = document.getElementById('loginScreen');
  let loginMode = 'login';

  document.querySelectorAll('.login-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      loginMode = tab.dataset.tab;
      document.getElementById('loginBtn').textContent = loginMode === 'register' ? 'CREAT ACCOUNT' : 'MASUK';
    });
  });

  function updateProfile(username, role) {
    document.getElementById('headerProfileName').textContent = username.toUpperCase();
    const roleEl = document.getElementById('headerProfileRole');
    roleEl.className = 'profile-role role-' + role;
    document.getElementById('headerRoleText').textContent = role;
  }

  document.getElementById('loginBtn').addEventListener('click', () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    const err = document.getElementById('loginError');
    err.textContent = '';
    if (!u || !p) { err.textContent = 'USERNAME & PASSWORD WAJIB'; return; }
    const users = getUsers();
    if (loginMode === 'register') {
      if (users[u]) { err.textContent = 'USERNAME SUDAH ADA'; return; }
      users[u] = { pass: p, role: 'MEMBER' };
      saveUsers(users);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ user: u, role: 'MEMBER' }));
      updateProfile(u, 'MEMBER');
      loginScreen.classList.add('hidden');
      showOverlay('AKUN BERHASIL DIBUAT');
    } else {
      if (!users[u] || users[u].pass !== p) { err.textContent = 'USERNAME / PASSWORD SALAH'; return; }
      localStorage.setItem(SESSION_KEY, JSON.stringify({ user: u, role: users[u].role }));
      updateProfile(u, users[u].role);
      loginScreen.classList.add('hidden');
    }
  });

  (function autoLogin() {
    const s = getSession();
    if (s && s.user) {
      updateProfile(s.user, s.role || 'MEMBER');
      loginScreen.classList.add('hidden');
    }
  })();

  const loadingOverlay = document.getElementById('loadingOverlay');
  const overlay = document.getElementById('overlay');
  let overlayTimer;
  function showLoading(text) { document.getElementById('loadingText').textContent = text; loadingOverlay.classList.add('show'); }
  function hideLoading() { loadingOverlay.classList.remove('show'); }
  function showOverlay(text) {
    document.getElementById('overlayText').textContent = text;
    overlay.classList.add('show');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => overlay.classList.remove('show'), 2000);
  }
  overlay.addEventListener('click', () => { overlay.classList.remove('show'); clearTimeout(overlayTimer); });

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  let intensity = 'normal';
  document.querySelectorAll('.intensity-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.intensity-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      intensity = opt.dataset.level;
    });
  });

  document.getElementById('btnSend').addEventListener('click', async () => {
    const target = document.getElementById('target').value.trim();
    if (!target) { document.getElementById('target').focus(); return; }
    const session = getSession();
    if (!session) { showToast('Login dulu'); return; }

    showLoading('MENGIRIM BUG...');
    try {
      const res = await fetch(BACKEND_URL + '/api/bug/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target, intensity, user: session.user })
      });
      const data = await res.json();
      hideLoading();
      showOverlay(data.success ? 'BUG TELAH DIKIRIM' : 'GAGAL: ' + data.message);
    } catch (err) {
      hideLoading();
      showToast('Backend offline');
    }
  });

  async function checkBackend() {
    const start = Date.now();
    try {
      const res = await fetch(BACKEND_URL + '/api/status');
      const data = await res.json();
      document.getElementById('serverStatusText').textContent = 'BACKEND CONNECTED';
      document.getElementById('latencyText').textContent = (Date.now() - start) + ' ms';
    } catch (e) {
      document.getElementById('serverStatusText').textContent = 'BACKEND OFFLINE';
      document.getElementById('latencyText').textContent = '--';
    }
  }
  checkBackend();
  setInterval(checkBackend, 10000);
</script>
</body>
</html>
